<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPT MAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #d1d5db;
        }
        .metal-silver {
            color: #e5e7eb;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.2);
        }
        .timer-red {
            color: #ef4444;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 font-mono select-none">

    <!-- Top Header Bar -->
    <header class="w-full flex justify-between items-center pb-2 border-b border-zinc-800">
        <div class="text-lg font-bold metal-silver tracking-wider">OPT MAN</div>
        <div class="text-sm metal-silver cursor-pointer hover:text-white transition-colors">Settings</div>
    </header>

    <!-- Main OTP Display Section -->
    <main class="w-full max-w-xl mx-auto my-auto flex flex-col items-center justify-center space-y-6">
        
        <!-- Timer & OTP Container -->
        <div class="w-full relative flex flex-col items-center">
            <!-- 10 Min Countdown Timer (Top Right of OTP area) -->
            <div id="countdown" class="text-sm font-bold timer-red self-end mr-4 mb-1">10:00</div>

            <!-- Massive OTP Code Display -->
            <div id="otpCode" class="text-6xl sm:text-7xl font-extrabold metal-silver tracking-widest text-center">
                000 000
            </div>
            
            <!-- Service Name Indicator -->
            <div id="serviceName" class="text-xs metal-silver opacity-60 mt-2 uppercase tracking-widest">
                Waiting for incoming OTP...
            </div>
        </div>

        <!-- Recent OTP History List -->
        <div class="w-full mt-12 space-y-2">
            <div class="text-xs metal-silver opacity-50 uppercase tracking-wider mb-2">Recent Logs</div>
            <div id="historyList" class="space-y-2 text-sm metal-silver">
                <!-- History items will populate here -->
                <div class="opacity-30">------</div>
                <div class="opacity-30">------</div>
                <div class="opacity-30">------</div>
            </div>
        </div>
    </main>

    <!-- Footer Status Bar -->
    <footer class="w-full text-center text-xs metal-silver opacity-40 pt-4 border-t border-zinc-900">
        Status: <span id="syncStatus" class="text-emerald-500">Connecting...</span>
    </footer>

    <!-- Scripting Logic -->
    <script>
        // Yahan apne Render backend ka URL daalein
        const BACKEND_URL = 'https://opt-server-r0vl.onrender.com/';

        let currentOtpTime = null;
        const EXPIRY_TIME_MS = 10 * 60 * 1000; // 10 Minutes
        let historyArray = [];

        async function fetchLatestOtp() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/latest-otp`);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                if (data.code && data.code !== "------") {
                    const receivedTime = new Date().getTime();
                    
                    // Agar naya OTP aaya hai toh update karo
                    if (window.lastCode !== data.code) {
                        window.lastCode = data.code;
                        currentOtpTime = receivedTime;
                        
                        // Add to history
                        historyArray.unshift({
                            code: data.code,
                            service: data.service || 'Unknown',
                            time: new Date().toLocaleTimeString()
                        });
                        if (historyArray.length > 3) historyArray.pop();
                        updateHistoryUI();
                    }

                    // Format code with space (e.g. 123 456)
                    let formattedCode = data.code;
                    if (data.code.length === 6 && !data.code.includes(' ')) {
                        formattedCode = data.code.slice(0, 3) + ' ' + data.code.slice(3);
                    }

                    document.getElementById('otpCode').innerText = formattedCode;
                    document.getElementById('serviceName').innerText = data.service || 'OTP Received';
                }

                document.getElementById('syncStatus').innerText = "Live Sync Active";
                document.getElementById('syncStatus').className = "text-emerald-500";

            } catch (err) {
                console.error('Fetch failed:', err);
                document.getElementById('syncStatus').innerText = "Disconnected";
                document.getElementById('syncStatus').className = "text-rose-500";
            }
        }

        // Countdown & Auto-Delete Timer Loop (Every 1 second)
        setInterval(() => {
            if (!currentOtpTime) {
                document.getElementById('countdown').innerText = "10:00";
                return;
            }

            const elapsed = new Date().getTime() - currentOtpTime;
            const remaining = EXPIRY_TIME_MS - elapsed;

            if (remaining <= 0) {
                // Auto-delete / Expire OTP after 10 mins
                document.getElementById('otpCode').innerText = "000 000";
                document.getElementById('serviceName').innerText = "OTP Expired / Deleted";
                document.getElementById('countdown').innerText = "00:00";
                currentOtpTime = null;
            } else {
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('countdown').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        function updateHistoryUI() {
            const historyContainer = document.getElementById('historyList');
            historyContainer.innerHTML = '';
            
            historyArray.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center py-1 border-b border-zinc-900";
                div.innerHTML = `<span>${item.code}</span> <span class="text-xs opacity-50">${item.service} (${item.time})</span>`;
                historyContainer.appendChild(div);
            });
        }

        // Poll backend every 3 seconds for new OTPs
        setInterval(fetchLatestOtp, 3000);
        fetchInitial();
        function fetchInitial() { fetchLatestOtp(); }
    </script>
</body>
</html>
